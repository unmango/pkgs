name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            runs-on: thecluster
          - name: aarch64-linux
            runs-on: ubuntu-24.04-arm
          - name: aarch64-darwin
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@3ec4ed5a6af9c00f6a39e079df488573c77ebda6 # v1.0.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_name: mangopkgs
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extra_nix_config: |
            # Trigger Nix GC on GitHub-hosted runners when < 3GiB free; keep up to 10GiB free.
            min-free = 3221225472
            max-free = 10737418240
            # Trust the substituter/key the flake declares via nixConfig.
            accept-flake-config = true
            allow-import-from-derivation = false

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: unstoppablemango

      - run: make check build

  codegen:
    runs-on: thecluster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@3ec4ed5a6af9c00f6a39e079df488573c77ebda6 # v1.0.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_name: mangopkgs
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extra_nix_config: |
            # Trigger Nix GC on GitHub-hosted runners when < 3GiB free; keep up to 10GiB free.
            min-free = 3221225472
            max-free = 10737418240
            # Trust the substituter/key the flake declares via nixConfig.
            accept-flake-config = true
            allow-import-from-derivation = false

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: unstoppablemango

      - run: nix develop -c make generate
      - run: git diff --exit-code
