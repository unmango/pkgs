name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            runs-on: ubuntu-latest
          - name: aarch64-linux
            runs-on: ubuntu-24.04-arm
          - name: aarch64-darwin
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            # Trigger Nix GC on GitHub-hosted runners when < 3GiB free; keep up to 10GiB free.
            min-free = 3221225472
            max-free = 10737418240
            # Trust the substituter/key the flake declares via nixConfig.
            accept-flake-config = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: unstoppablemango

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: mangopkgs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: make check build

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            # Trigger Nix GC on GitHub-hosted runners when < 3GiB free; keep up to 10GiB free.
            min-free = 3221225472
            max-free = 10737418240
            # Trust the substituter/key the flake declares via nixConfig.
            accept-flake-config = true

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: unstoppablemango

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: mangopkgs
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix develop -c make generate
      - run: git diff --exit-code
