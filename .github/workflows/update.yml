name: Update

on:
  schedule:
    # Daily. Renovate handles flake inputs on its own weekly schedule; this
    # job is only about the packages' own upstream releases.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@3ec4ed5a6af9c00f6a39e079df488573c77ebda6 # v1.0.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          cachix_name: mangopkgs
          cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extra_nix_config: |
            # Trigger Nix GC on GitHub-hosted runners when < 3GiB free; keep up to 10GiB free.
            min-free = 3221225472
            max-free = 10737418240
            # Trust the substituter/key the flake declares via nixConfig.
            accept-flake-config = true

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: unstoppablemango

      - name: Run update automation
        env:
          # Commits are created through the GitHub API (createCommitOnBranch),
          # so they are attributed to the token identity and signed by GitHub;
          # no git author/committer configuration is needed.
          #
          # A PAT rather than GITHUB_TOKEN: main's ruleset requires an extra
          # approval for unattributed changes and a passing build check, and
          # GITHUB_TOKEN satisfies neither (its commits belong to the Actions
          # bot, and the pull requests it opens do not trigger workflows).
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: nix develop -c ./scripts/update.sh
